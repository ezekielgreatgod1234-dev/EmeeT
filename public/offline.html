<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0612" />
    <title>EmeeT - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0612;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #9333ea;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
      }
      p { color: #9ca3af; max-width: 320px; margin: 8px auto 24px; }
      button {
        background: #9333ea;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="logo">E</div>
      <h1>You are offline</h1>
      <p>EmeeT needs an internet connection to link your devices. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
