<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0612" />
    <meta
      name="description"
      content="Share a screen between devices, detect questions and send them to Claude."
    />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EmeeT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <title>EmeeT - Share, Detect, Answer</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Catch the browser's install prompt before React starts. -->
    <script>
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__installPrompt = event
        window.dispatchEvent(new Event('emeet-install-ready'))
      })
    </script>
  </head>
  <body class="bg-[#0a0612]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
